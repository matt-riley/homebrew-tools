name: Formula release PR

on:
  pull_request:
    branches: [main]
    paths:
      - Formula/**
      - script/generate-readme.rb
      - script/formula-release-pr-qualify.sh
      - test/**
      - .github/workflows/formula-release-pr.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      qualified: ${{ steps.qualify.outputs.qualified }}
      reason: ${{ steps.qualify.outputs.reason }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Qualify formula release pull request
        id: qualify
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          script/formula-release-pr-qualify.sh \
            --event pull_request \
            --base-ref "origin/${BASE_REF}" \
            --head-sha "$HEAD_SHA"

  validate:
    needs: qualify
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Test README generator
        run: ruby test/generate_readme_test.rb

      - name: Check duplicate package basenames
        run: script/check-duplicate-package-basenames.sh

      - name: Check README is current (manual formula pull requests)
        if: needs.qualify.outputs.qualified != 'true'
        run: ruby script/generate-readme.rb --check
