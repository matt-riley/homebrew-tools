name: Formula merge

# Drains all mergeable formula release pull requests serially (one workflow
# run at a time), refreshes README on main, and dispatches site sync.
on:
  workflow_run:
    workflows: [Formula release PR]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  merge:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: formula-merge
      cancel-in-progress: false
    env:
      # Add crap's tap App login (app/<slug>) when crap moves to PR mode.
      FORMULA_RELEASE_PR_AUTHORS: matt-riley
    steps:
      - name: Check out main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge qualified pull requests and refresh main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          script/merge-formula-release-prs.sh
